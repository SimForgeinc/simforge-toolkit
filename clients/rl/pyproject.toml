[project]
name = "simforge-rl"
version = "0.1.1"
description = "Gymnasium environments, scenario-set task distributions and the runtime-protocol client for the SimForge runtime"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SimForge" }]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Artificial Intelligence"]
dependencies = [
    "gymnasium>=1.1",
    "numpy>=1.24",
]

[project.optional-dependencies]
ppo = ["torch>=2.0"]
dev = ["build==1.3.0", "pytest==9.1.1"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simforge_rl"]

[tool.hatch.build.targets.sdist]
include = ["simforge_rl", "tests", "examples", "LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
