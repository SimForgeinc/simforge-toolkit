[project]
name = "simforge-cloud"
version = "0.1.1"
description = "Typed synchronous Python client for the SimForge Cloud API"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SimForge" }]
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.12.0",
]

[project.optional-dependencies]
dev = [
    "build==1.3.0",
    "datamodel-code-generator==0.35.0",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["simforge_cloud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
