[package]
name = "simforge-glb"
description = "Binary glTF (GLB) reading and measurement for SimForge actor models and engine-free CLI vehicle validation; no renderer or engine dependency."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
rust-version = "1.85"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
